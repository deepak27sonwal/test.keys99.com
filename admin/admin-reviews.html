<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06251f">

<title>Reviews | Keys99 Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-reviews.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<div class="admin-shell">

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <main class="admin-main">

    <div class="admin-topbar">
      <div class="admin-title">
        <h1>Reviews</h1>
        <p>Moderate reviews submitted on properties and developers.</p>
      </div>
    </div>

    <div class="admin-message" id="reviewMessage" hidden></div>

    <div class="admin-panel">

      <div class="admin-filters">
        <button type="button" class="admin-filter-btn active" data-filter="pending">Pending</button>
        <button type="button" class="admin-filter-btn" data-filter="approved">Approved</button>
        <button type="button" class="admin-filter-btn" data-filter="rejected">Rejected</button>
        <button type="button" class="admin-filter-btn" data-filter="all">All</button>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Reviewer</th>
              <th>On</th>
              <th>Rating</th>
              <th>Comment</th>
              <th>Submitted</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="reviewTableBody">
            <tr class="admin-empty-row"><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </div>

    </div>

  </main>

</div>


<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script>

/* =========================================================
   KEYS99 - ADMIN REVIEWS
========================================================= */

let allReviews = [];
let activeFilter = "pending";

(async () => {

  const user = await requireAdmin();
  if(!user) return;

  renderAdminSidebar("admin-reviews.html");

  await loadReviews();

  document.querySelectorAll(".admin-filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".admin-filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      renderTable();
    });
  });

})();


async function loadReviews(){

  const { data, error } = await supabaseClient
    .from("reviews")
    .select("id, reviewer_name, rating, comment, status, created_at, property_id, developer_id, projects(developer, city), developers(name)")
    .order("created_at", { ascending: false });

  if(error){
    showAdminMessage("reviewMessage", "Failed to load reviews: " + error.message, "error");
    return;
  }

  allReviews = data || [];
  renderTable();

}

function renderTable(){

  const tbody = document.getElementById("reviewTableBody");

  let rows = allReviews;

  if(activeFilter !== "all"){
    rows = rows.filter(r => r.status === activeFilter);
  }

  if(rows.length === 0){
    tbody.innerHTML = '<tr class="admin-empty-row"><td colspan="7">No reviews match this view.</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr data-id="${r.id}">
      <td style="font-weight:700;">${escapeAdminHtml(r.reviewer_name || "Anonymous")}</td>
      <td class="admin-cell-muted">${r.projects ? escapeAdminHtml(r.projects.developer || "Listing") : (r.developers ? escapeAdminHtml(r.developers.name) + " (Developer)" : "-")}</td>
      <td>${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</td>
      <td class="admin-cell-muted">${escapeAdminHtml((r.comment || "").slice(0, 80))}${(r.comment || "").length > 80 ? "..." : ""}</td>
      <td class="admin-cell-muted">${adminFormatDate(r.created_at)}</td>
      <td>${adminBadge(r.status)}</td>
      <td>
        <div class="admin-row-actions">
          ${r.status !== "approved" ? '<button type="button" class="admin-btn admin-btn-primary" data-role="approve">Approve</button>' : ""}
          ${r.status !== "rejected" ? '<button type="button" class="admin-btn" data-role="reject">Reject</button>' : ""}
          <button type="button" class="admin-btn admin-btn-danger" data-role="delete">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");

  tbody.querySelectorAll('[data-role="approve"]').forEach(btn => {
    btn.addEventListener("click", () => setReviewStatus(btn.closest("tr").dataset.id, "approved"));
  });
  tbody.querySelectorAll('[data-role="reject"]').forEach(btn => {
    btn.addEventListener("click", () => setReviewStatus(btn.closest("tr").dataset.id, "rejected"));
  });
  tbody.querySelectorAll('[data-role="delete"]').forEach(btn => {
    btn.addEventListener("click", () => deleteReview(btn.closest("tr").dataset.id));
  });

}

async function setReviewStatus(id, status){

  const { error } = await supabaseClient
    .from("reviews")
    .update({ status })
    .eq("id", id);

  if(error){
    showAdminMessage("reviewMessage", "Failed to update: " + error.message, "error");
    return;
  }

  const local = allReviews.find(r => r.id === id);
  if(local) local.status = status;

  showAdminMessage("reviewMessage", "Review " + status + ".", "success");
  renderTable();

}

async function deleteReview(id){

  if(!confirm("Delete this review? This can't be undone.")) return;

  const { error } = await supabaseClient.from("reviews").delete().eq("id", id);

  if(error){
    showAdminMessage("reviewMessage", "Failed to delete: " + error.message, "error");
    return;
  }

  allReviews = allReviews.filter(r => r.id !== id);
  showAdminMessage("reviewMessage", "Review deleted.", "success");
  renderTable();

}

</script>

</body>
</html>
